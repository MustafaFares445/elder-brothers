name: install-filament-dashboard

on:
  push:
    branches: [main]
    paths:
      - '.dashboard-install/**'
      - '.github/workflows/install-filament-dashboard.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract dashboard implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .dashboard-install/part-* | base64 --decode > /tmp/filament_impl.tar.xz
          echo "3b459ba2c26c64c6fe96a590df660276cdb0ce1af66054c74c8a8a2123fd2996  /tmp/filament_impl.tar.xz" | sha256sum --check
          tar -xJf /tmp/filament_impl.tar.xz -C .
          rm -rf .dashboard-install
          rm -f .github/workflows/install-filament-dashboard.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement Arabic RTL Filament v5 dashboard"
          git push origin HEAD:main
