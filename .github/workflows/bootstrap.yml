name: Bootstrap Laravel backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/bootstrap_payload.py
      - tools/payload.*
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract Laravel application
        run: python tools/bootstrap_payload.py
      - name: Validate PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Commit generated application
        run: |
          rm -f tools/bootstrap_payload.py tools/payload.* .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Elder Brothers Laravel API"
          git push origin main
